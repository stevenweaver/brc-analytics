id: https://github.com/galaxyproject/brc-analytics/blob/main/catalog/py_package/catalog_build/schema/outbreaks.yaml#
name: outbreaks
description: Schema for defining outbreak and pathogen information used in the BRC Analytics platform.

prefixes:
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
  - enums/library_layout
  - enums/library_source
  - enums/library_strategy
  - enums/outbreak_priority
  - enums/outbreak_resource_type

classes:
  Outbreaks:
    description: Root object containing a collection of pathogen definitions for the BRC Analytics platform to highlight as outbreaks/priority pathogens.
    tree_root: true
    attributes:
      outbreaks:
        description: Collection of pathogen entries that will be displayed in the BRC Analytics platform as outbreaks/priority pathogens.
        required: true
        multivalued: true
        range: Outbreak

  Outbreak:
    description: Definition of a priority pathogen with its taxonomic classification, priority level, and associated resources.
    attributes:
      name:
        description: The display name of the pathogen as it will appear in the BRC Analytics interface.
        required: true
        range: string
      taxonomy_id:
        description: The NCBI Taxonomy ID for the pathogen. Used to link to relevant genomic data and workflows.
        required: true
        range: integer
      priority:
        description: The priority level of the pathogen, which determines its visibility and prominence in the BRC Analytics interface.
        required: true
        range: OutbreakPriority
      resources:
        description: Collection of external resources (references, tools, databases) related to the pathogen.
        required: true
        multivalued: true
        range: OutbreakResource
      description:
        description: Reference to a markdown file containing detailed information about the pathogen.
        required: true
        range: MarkdownFileReference
      active:
        description: Boolean flag that determines if the pathogen should be included in the BRC Analytics interface. Used to manage visibility as pathogen relevance changes over time.
        required: true
        range: boolean
      highlight_descendant_taxonomy_ids:
        description: List of NCBI Taxonomy IDs for descendant taxa (e.g., specific strains or serotypes) that should be highlighted within the outbreak category.
        required: false
        multivalued: true
        range: integer
      precomputed:
        description: Optional pre-computed workflow results for this pathogen, including how to discover eligible runs and where the published results are.
        required: false
        range: PrecomputedResults

  PrecomputedResults:
    description: Pre-computed results of a workflow run on public data for a pathogen.
    attributes:
      workflow_trs_id:
        description: The TRS ID of the workflow (including version) used to compute the results.
        required: true
        range: string
      discovery:
        description: Criteria for discovering public sequencing runs to process. If omitted, runs are not discovered automatically.
        required: false
        range: PrecomputedDiscovery
      release:
        description: Details of the latest published results. If omitted, no results are shown.
        required: false
        range: PrecomputedRelease

  PrecomputedDiscovery:
    description: Criteria for discovering public sequencing runs to process with a workflow.
    attributes:
      taxonomy_id:
        description: The NCBI Taxonomy ID to discover runs for, if different from the taxonomy ID of the pathogen.
        required: false
        range: integer
      library_layout:
        description: The library layout that discovered runs must have.
        required: false
        range: LibraryLayout
      library_strategy:
        description: The library strategy values that discovered runs may have.
        required: false
        multivalued: true
        range: LibraryStrategy
      library_source:
        description: The library source values that discovered runs may have.
        required: false
        multivalued: true
        range: LibrarySource
      instrument_platform:
        description: The instrument platforms that discovered runs may have (e.g., 'ILLUMINA').
        required: false
        multivalued: true
        range: string
      first_public_from:
        description: Only runs first made public on or after this date (YYYY-MM-DD) are discovered.
        required: false
        range: string
        pattern: '^\d{4}-\d{2}-\d{2}$'

  PrecomputedRelease:
    description: Details of a published set of pre-computed results.
    attributes:
      manifest_url:
        description: Location of the manifest describing the published results, as a path relative to the configured release base URL, or a complete URL (including http/https protocol) where the results are hosted elsewhere.
        required: true
        range: string
      last_updated:
        description: The date (YYYY-MM-DD) the results were last updated.
        required: true
        range: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      record_count:
        description: The number of records in the published results.
        required: false
        range: integer

  OutbreakResource:
    description: Definition of an external resource (reference, tool, database) associated with a priority pathogen.
    attributes:
      url:
        description: The complete URL (including http/https protocol) to the external resource.
        required: true
        range: string
      title:
        description: The display title for the resource link as it will appear in the BRC Analytics interface.
        required: true
        range: string
      type:
        description: The category or type of the resource (e.g., REFERENCE, TOOL, DATABASE), which determines how it is displayed and organized.
        required: true
        range: OutbreakResourceType

  MarkdownFileReference:
    description: A reference to a markdown file containing detailed content about a priority pathogen.
    attributes:
      path:
        description: Relative path to the markdown file from the project root. Must end with .md extension.
        required: true
        range: string
        pattern: '.*\.md$'
